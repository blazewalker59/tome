name: CI/CD

# One pipeline for PRs and production.
#
#   PR:            checks      ─┐
#                  test        ─┼─ (gate only)
#                  integration ─┘
#
#   push to main:  checks(+artifact) ─┐
#                  test              ─┼─ migrate ─ deploy (reuses the build)
#                  integration       ─┘
#
# Replaces the old deploy.yml, which ran only on main, had no lint or
# typecheck step, and had failed on every run since April because
# `bun install --frozen-lockfile` couldn't resolve imports that were never
# declared in package.json.
#
# Decisions worth keeping:
# - `checks` folds lint + typecheck + build into one job. Each is seconds of
#   work, so one install beats three.
# - `test` is sharded 3 ways. The suite is ~2s on a dev machine but the
#   2-core runners are the bottleneck, so parallelism is the lever.
# - `deploy` downloads the dist/ artifact from `checks` rather than
#   rebuilding, so the bytes that were tested are the bytes that ship.
# - `migrate` applies D1 migrations BEFORE deploy. The new Worker may expect
#   columns the old schema lacks, so schema-first is the safe order. It is a
#   separate job so a migration failure blocks the deploy instead of leaving
#   new code against an old schema.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run mid-deploy; superseded PR runs are fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint / Types / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Only main pushes need the build downstream (deploy). PR builds are a
      # pass/fail gate; skip the upload.
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:run --shard=${{ matrix.shard }}/3

  # Real D1, in-process via @cloudflare/vitest-pool-workers, applying the same
  # ./drizzle migrations wrangler applies to production.
  #
  # A separate job because it is a different kind of check, and because two
  # production bugs got through everything else: a statement that could not be
  # batched, and an ON CONFLICT target SQLite would not accept. Both
  # type-checked, both passed unit tests against a fake, and neither could run.
  # Not sharded — the whole suite is ~1s, so the runner's startup dominates.
  integration:
    name: Integration (real D1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No Cloudflare credentials needed: miniflare runs D1 locally.
      - name: Run integration tests
        run: bun run test:integration

  # Schema before code. Wrangler tracks which migrations it has applied in
  # D1's own d1_migrations table, so re-running is a no-op when nothing is
  # pending — this job is cheap on the common path.
  migrate:
    name: Apply D1 migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Installed for wrangler alone, pinned by bun.lock. Letting
      # wrangler-action fall back to its own bundled wrangler invites version
      # drift against a JSONC config; using the repo's binary means CI runs
      # the same wrangler as `bun run ship` locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to remote D1
        run: bunx wrangler d1 migrations apply tome-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test, integration, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reuse the build from `checks` — no rebuild, so the artifact that
      # passed the gate is the artifact that ships.
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      # Worker secrets (BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, HARDCOVER_API_TOKEN, ADMIN_EMAILS) are managed
      # out-of-band via `wrangler secret put` and persist across deploys —
      # nothing is uploaded per-deploy. BETTER_AUTH_URL is NOT a secret; it is
      # a plain var in wrangler.jsonc and ships with this deploy. DATABASE_URL
      # is gone: the database is a binding now, also declared there.
      #
      # The vite-built worker bundle is passed positionally, which overrides
      # `main` in wrangler.jsonc (that points at source, for the vite plugin).
      - name: Deploy
        run: bunx wrangler deploy dist/server/index.js --config wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
